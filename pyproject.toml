[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "UniversalSpeech"
version = "3.0.0"
description = "UniversalSpeech provides a unified, cross-platform Python SDK for speech synthesis, screen readers (NVDA, JAWS, Narrator, Orca, VoiceOver), and braille displays across Windows, Linux, and macOS."
readme = "readme.md"
authors = [
    { name = "Mahmoud Atef", email = "mahmoud.atef.987123@gmail.com" }
]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Adaptive Technologies",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
keywords = ["speech", "accessibility", "screen reader", "jaws", "nvda", "orca", "voiceover", "speech-dispatcher", "espeak", "tts", "cross-platform"]
requires-python = ">=3.7"
dependencies = []

[project.urls]
Homepage = "https://github.com/MahmoudAtef999/PythonUniversalSpeech"
Repository = "https://github.com/MahmoudAtef999/PythonUniversalSpeech.git"
Issues = "https://github.com/MahmoudAtef999/PythonUniversalSpeech/issues"
"Upstream UniversalSpeech" = "https://github.com/qtnc/UniversalSpeech"

[tool.setuptools.packages.find]
include = ["UniversalSpeech*"]
exclude = ["tests*", "dist*", "build*"]

[tool.setuptools.package-data]
UniversalSpeech = ["lib/*", "lib64/*", "py.typed"]

[tool.pytest.ini_options]
addopts = "-p no:faulthandler"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.coverage.run]
source = ["UniversalSpeech"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
