name: Publish to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build and verify only, do not upload to PyPI)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Verify package metadata with twine
        run: |
          python -m twine check --strict dist/*

      - name: Verify distribution contents and security
        run: |
          $whl = (Get-Item dist/*.whl).FullName
          $tar = (Get-Item dist/*.tar.gz).FullName
          
          python -c @"
          import zipfile, tarfile, sys
          
          whl_path = r'$whl'
          tar_path = r'$tar'
          
          with zipfile.ZipFile(whl_path) as z:
              whl_files = z.namelist()
              if any('ZDSRAPI' in f for f in whl_files):
                  sys.exit('Error: ZDSRAPI.dll found in wheel archive!')
              if not any(f.endswith('UniversalSpeech.dll') for f in whl_files):
                  sys.exit('Error: UniversalSpeech.dll missing from wheel archive!')
          
          with tarfile.open(tar_path) as t:
              tar_files = t.getnames()
              if any('ZDSRAPI' in f for f in tar_files):
                  sys.exit('Error: ZDSRAPI.dll found in sdist archive!')
          
          print('Distribution contents and security checks passed successfully.')
          "@

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/UniversalSpeech
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing via OIDC

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
